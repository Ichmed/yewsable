[package]
name = "yewsable"
version = "0.1.0"
edition = "2024"

[dependencies]
indexmap = { version = "2.14.2", optional = true }
gloo = "0.12.0"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = { version = "0.4.78", optional = true }
web-sys = "0.3.105"
yew = { version = "0.23.0", features = ["csr"] }
yew-autoprops = "0.5.0"
iddqd = { version = "0.5.0", optional = true }

[features]
async = ["dep:wasm-bindgen-futures"]
indexmap = ["dep:indexmap"]
iddqd = ["dep:iddqd"]
default = ["indexmap", "iddqd"]

[[bin]]
name = "test"
features = ["indexmap"]
